[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lispic"
version = "0.1.0"
description = "Personal static photography sites in Hy"
requires-python = ">=3.11"
dependencies = ["hy==1.3.1", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
lispic = "lispic:main"

[tool.setuptools.package-data]
lispic = ["*.hy", "static/*"]

[tool.setuptools.packages.find]
include = ["lispic*"]
